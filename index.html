<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover ist Voraussetzung dafuer, dass env(safe-area-inset-*)
         im Anzeigemodus standalone ueberhaupt Werte liefert (A25a). Ohne diese
         Angabe bleiben die Werte durchgaengig 0px, und der Inhalt liegt unter
         Notch und Home-Indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Muss mit manifest.theme_color in vite.config.ts uebereinstimmen. -->
    <meta name="theme-color" content="#0b6b3a" />
    <meta
      name="description"
      content="Teameinteilung und Terminverwaltung fuer die Trainingsgruppe."
    />
    <link rel="icon" type="image/png" href="/icons/pwa/app-icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/pwa/apple-touch-icon.png" />
    <title>MONTAGS-KICKER</title>
  </head>
  <body>
    <div id="root">
      <!-- Steht im ersten Bild, noch bevor das Skript laeuft; React ersetzt den
           Inhalt beim ersten Rendern (createRoot leert #root). Stil in
           src/styles/global.scss (.startLader). -->
      <div class="startLader" role="status">
        <span class="startLaderKreis"></span>
        <span class="nurFuerScreenreader">Wird geladen</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
