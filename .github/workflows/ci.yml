name: CI

on:
  push:
    branches: [dev_client]
  pull_request:

jobs:
  pruefen:
    name: Lint, Typen, Bau und Unit-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  e2e:
    name: End-to-End (Chromium)
    # Erst wenn Lint, Typen und Unit-Tests stehen: Die E2E-Suite ist der teuerste
    # Schritt und sagt bei einem Typfehler nichts Neues.
    needs: pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      # Nur Chromium: Die vier WebKit-Projekte sind seit dem 18.10.2026 abgeschaltet
      # (siehe `playwright.config.ts`, `WEBKIT_E2E`). Anlass fuer WebKit war der
      # 03.10.2026: Die PIN-Kaestchen standen nur in Safari untereinander. Zum
      # Wiedereinschalten `webkit` hier ergaenzen (`--with-deps chromium webkit`)
      # und `WEBKIT_E2E: '1'` am Testschritt setzen.
      - run: npx playwright install --with-deps chromium

      # Die drei Chromium-Projekte. Ohne Server: Die Layout-Tests brauchen keine
      # API, die Namensauswahl bildet sie im Browser nach (`page.route`).
      - run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
